name: reliable
homepage: https://dev-cetera.com/
repository: https://github.com/dev-cetera/reliable
funding:
  - https://www.buymeacoffee.com/dev_cetera
  - https://www.patreon.com/c/robelator
  - https://github.com/sponsors/robelator
description: "An offline-first, secure data repository with automatic sync, retry, and encryption for Dart & Flutter."
version: 0.1.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  uuid: ^4.5.3
  synchronized: ^3.4.0+1
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1
  sqflite: ^2.4.2+1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  encrypt: ^5.0.3
  
  df_log: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
